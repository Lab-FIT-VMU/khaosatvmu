# Container này luôn tự nhận $scheme = http (nó không tự chạy TLS). Khi đứng
# sau TLS ingress ở host (nginx-host/Caddy/LB), phải giữ nguyên X-Forwarded-Proto
# ingress đã gửi xuống thay vì ghi đè bằng $scheme, nếu không API sẽ luôn nghĩ
# request là http dù client vào bằng https -> Google OIDC sinh redirect_uri sai
# scheme, cookie Secure không gửi được.
map $http_x_forwarded_proto $proxied_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable static assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html không được cache dài hạn, tránh trỏ tới asset cũ đã bị xóa
    # sau mỗi lần deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_forwarded_proto;
    }

    # Google OIDC middleware handles this callback outside the /api prefix.
    location = /signin-google {
        proxy_pass http://api:8080/signin-google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_forwarded_proto;
    }

    # Health check probe
    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
